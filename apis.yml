description: >-
  The U.S. Consumer Product Safety Commission (CPSC) is the federal agency responsible for protecting the public from
  unreasonable risks of injury or death associated with consumer products such as toys, household items, electronics,
  and furniture. CPSC publishes a public, unauthenticated Recalls Retrieval Web Service that exposes recall records
  (with products, hazards, manufacturers, retailers, distributors, importers, and remedies) in JSON or XML, plus the
  SaferProducts.gov OData service for incident-report data accessed by application key.
